<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard Memory Vocabulary - SDN Pakamban Daja</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 3D Card Flip Styles */
        .perspective {
            perspective: 1000px;
        }

        .card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            padding: 8px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Card Back (Hidden Cover) */
        .card-back {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            z-index: 2;
            font-size: 1.75rem;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .card-back::after {
            content: '?';
            font-size: 2rem;
            opacity: 0.8;
        }

        /* Card Front (Revealed Content) */
        .card-front {
            background-color: #ffffff;
            transform: rotateY(180deg);
            font-size: clamp(0.85rem, 2.2vw, 1.15rem);
            font-weight: 800;
            color: #0f172a;
            z-index: 1;
            word-break: break-word;
        }

        /* Card Front - Language Indicator Badge */
        .card-lang-tag {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-lang-tag.en {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .card-lang-tag.id {
            background-color: #fef3c7;
            color: #92400e;
        }

        /* Matched Card Effect */
        .card-inner.matched .card-front {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #14532d !important;
            animation: match-pulse 0.4s ease-out;
        }

        .card-inner.matched {
            cursor: default;
        }

        @keyframes match-pulse {
            0% { transform: rotateY(180deg) scale(0.95); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        /* Mismatch Shake Effect */
        .card-inner.shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20%, 60% { transform: rotateY(180deg) translateX(-6px); }
            40%, 80% { transform: rotateY(180deg) translateX(6px); }
        }

        /* Glassmorphism Styling */
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        /* Confetti Canvas */
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 120;
        }
    </style>
</head>

    <script>
        // --- Web Audio Synthesizer ---
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            try {
                const now = ctx.currentTime;
                if (type === 'flip') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'match') {
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const time = now + (idx * 0.08);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, time);
                        gain.gain.setValueAtTime(0.2, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + 0.25);
                    });
                } else if (type === 'mismatch') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'win') {
                    [392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const time = now + (idx * 0.09);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, time);
                        gain.gain.setValueAtTime(0.25, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + 0.4);
                    });
                }
            } catch (e) {
                console.warn('Audio playback suppressed', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                btn.classList.remove('bg-rose-900/40', 'text-rose-400');
                btn.classList.add('bg-slate-800', 'text-slate-200');
                icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
            } else {
                btn.classList.remove('bg-slate-800', 'text-slate-200');
                btn.classList.add('bg-rose-900/40', 'text-rose-400');
                icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
            }
        }

                { en: 'Truck', id: 'Truk' },
                { en: 'Submarine', id: 'Kapal Selam' },
                { en: 'Pedicab', id: 'Becak' },
                { en: 'Taxi', id: 'Taksi' },
                { en: 'Ambulance', id: 'Ambulans' },
                { en: 'Canoe', id: 'Sampan' },
                { en: 'Rikshaw', id: 'Bajaj' }
            ]
        };

        const gameGrid = document.getElementById('game-grid');
        const movesDisplay = document.getElementById('moves');
        const timerDisplay = document.getElementById('timer');
        const matchesDisplay = document.getElementById('matches');
        const victoryModal = document.getElementById('victory-modal');

        let flippedCards = [];
        let moves = 0;
        let matches = 0;
        let timer = 0;
        let timerInterval = null;
        let isLockBoard = false;
        let totalPairs = 10;

        function initGame() {
            const catKey = document.getElementById('category-select').value;
            totalPairs = parseInt(document.getElementById('difficulty-select').value) || 10;
            
            const selectedList = vocabularyCategories[catKey] || vocabularyCategories.dapur;
            const shuffledVocab = [...selectedList].sort(() => Math.random() - 0.5).slice(0, totalPairs);

            let deck = [];
            shuffledVocab.forEach((item, index) => {
                deck.push({ text: item.en, lang: 'EN', pairId: index });
                deck.push({ text: item.id, lang: 'ID', pairId: index });
            });

            deck.sort(() => Math.random() - 0.5);

            gameGrid.innerHTML = '';
            
            // Adapt grid height and columns based on total count
            deck.forEach((cardData) => {
                const card = document.createElement('div');
                card.classList.add('perspective', 'h-24', 'sm:h-28', 'w-full');
                card.innerHTML = `
                    <div class="card-inner w-full h-full" data-pair-id="${cardData.pairId}">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <span class="card-lang-tag ${cardData.lang.toLowerCase()}">${cardData.lang}</span>
                            <span>${cardData.text}</span>
                        </div>
                    </div>
                `;
                card.addEventListener('click', flipCard);
                gameGrid.appendChild(card);
            });

            resetStats();
            startTimer();
        }

        function flipCard() {
            if (isLockBoard) return;
            getAudioContext();
            
            const inner = this.querySelector('.card-inner');
            if (inner.classList.contains('is-flipped') || inner.classList.contains('matched')) return;

            playSound('flip');
            inner.classList.add('is-flipped');
            flippedCards.push(inner);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            moves++;
            movesDisplay.innerText = moves;

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                playSound('match');
                card1.classList.add('matched');
                card2.classList.add('matched');
                matches++;
                matchesDisplay.innerText = `${matches} / ${totalPairs}`;
                resetBoard();

                if (matches === totalPairs) {
                    setTimeout(endGame, 500);
                }
            } else {
                playSound('mismatch');
                card1.classList.add('shake');
                card2.classList.add('shake');

                setTimeout(() => {
                    card1.classList.remove('is-flipped', 'shake');
                    card2.classList.remove('is-flipped', 'shake');
                    resetBoard();
                }, 900);
            }
        }

        function resetBoard() {
            flippedCards = [];
            isLockBoard = false;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 0;
            timerInterval = setInterval(() => {
                timer++;
                const minutes = Math.floor(timer / 60).toString().padStart(2, '0');
                const seconds = (timer % 60).toString().padStart(2, '0');
                timerDisplay.innerText = `${minutes}:${seconds}`;
            }, 1000);
        }

        function resetStats() {
            moves = 0;
            matches = 0;
            movesDisplay.innerText = '0';
            matchesDisplay.innerText = `0 / ${totalPairs}`;
            timerDisplay.innerText = '00:00';
            victoryModal.classList.add('hidden');
        }

        function resetGame() {
            initGame();
        }

        function endGame() {
            clearInterval(timerInterval);
            playSound('win');
            startConfetti();

            const timeStr = timerDisplay.innerText;
            const accuracy = Math.round((totalPairs / moves) * 100);

            document.getElementById('final-moves').innerText = moves;
            document.getElementById('final-time').innerText = timeStr;
            document.getElementById('final-accuracy').innerText = `${accuracy}%`;

            victoryModal.classList.remove('hidden');
        }

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#38bdf8', '#fb7185', '#34d399', '#fbbf24', '#a78bfa'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 3 + 2,
                    vx: Math.random() * 2 - 1,
                    rot: Math.random() * 360
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (particles.some(p => p.y < canvas.height)) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onload = initGame;
    </script>
</body>
