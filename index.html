<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Flashcard Memory Vocabulary - SDN Pakamban Daja</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            touch-action: manipulation;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f8fafc;
            min-height: 100vh;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* 3D Card Flip Styles */
        .perspective {
            perspective: 1000px;
        }

        .card-inner {
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
            position: relative;
            width: 100%;
            height: 100%;
        }

        .card-inner.is-flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.85rem;
            padding: 8px;
            text-align: center;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        /* Card Back Cover */
        .card-back {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #ffffff;
            z-index: 2;
            font-size: 1.75rem;
            font-weight: 900;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .card-back::after {
            content: '?';
            font-size: 2rem;
            opacity: 0.8;
        }

        /* Card Front Revealed Content */
        .card-front {
            background-color: #ffffff;
            transform: rotateY(180deg);
            font-size: clamp(0.85rem, 2.2vw, 1.15rem);
            font-weight: 800;
            color: #0f172a;
            z-index: 1;
            word-break: break-word;
        }

        /* Language Badges */
        .card-lang-tag {
            position: absolute;
            top: 4px;
            right: 6px;
            font-size: 0.65rem;
            font-weight: 800;
            padding: 1px 6px;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .card-lang-tag.en {
            background-color: #dbeafe;
            color: #1e40af;
        }

        .card-lang-tag.id {
            background-color: #fef3c7;
            color: #92400e;
        }

        /* Matched & Shake Animations */
        .card-inner.matched .card-front {
            background-color: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #14532d !important;
            animation: match-pulse 0.4s ease-out;
        }

        .card-inner.matched {
            cursor: default;
        }

        @keyframes match-pulse {
            0% { transform: rotateY(180deg) scale(0.95); }
            50% { transform: rotateY(180deg) scale(1.08); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        .card-inner.shake {
            animation: shake 0.4s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: rotateY(180deg) translateX(0); }
            20%, 60% { transform: rotateY(180deg) translateX(-6px); }
            40%, 80% { transform: rotateY(180deg) translateX(6px); }
        }

        /* Active Player Glow Animations */
        .player-active-p1 {
            border-color: #38bdf8 !important;
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.4);
            animation: pulse-glow-p1 1.8s infinite alternate;
        }

        .player-active-p2 {
            border-color: #f43f5e !important;
            box-shadow: 0 0 20px rgba(244, 63, 94, 0.4);
            animation: pulse-glow-p2 1.8s infinite alternate;
        }

        @keyframes pulse-glow-p1 {
            from { box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
            to { box-shadow: 0 0 25px rgba(56, 189, 248, 0.6); }
        }

        @keyframes pulse-glow-p2 {
            from { box-shadow: 0 0 10px rgba(244, 63, 94, 0.2); }
            to { box-shadow: 0 0 25px rgba(244, 63, 94, 0.6); }
        }

        /* Turn Transition Animation */
        .turn-bounce-in {
            animation: turnBounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes turnBounceIn {
            0% { transform: scale(0.5) translateY(30px); opacity: 0; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }

        /* Glassmorphism Styling */
        .glass-card {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 120;
        }
    </style>
</head>

    <script>
        // --- Web Audio Synthesizer ---
        let soundEnabled = true;
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) audioCtx = new AudioContext();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            try {
                const now = ctx.currentTime;
                if (type === 'flip') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(320, now);
                    osc.frequency.exponentialRampToValueAtTime(500, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'match') {
                    [523.25, 659.25, 783.99].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const time = now + (idx * 0.08);
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(freq, time);
                        gain.gain.setValueAtTime(0.2, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.25);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + 0.25);
                    });
                } else if (type === 'mismatch') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(220, now);
                    osc.frequency.linearRampToValueAtTime(140, now + 0.2);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(now);
                    osc.stop(now + 0.2);
                } else if (type === 'switch') {
                    [440, 587.33].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const time = now + (idx * 0.1);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, time);
                        gain.gain.setValueAtTime(0.18, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.2);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + 0.2);
                    });
                } else if (type === 'win') {
                    [392.00, 523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        const time = now + (idx * 0.09);
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, time);
                        gain.gain.setValueAtTime(0.25, time);
                        gain.gain.exponentialRampToValueAtTime(0.001, time + 0.4);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(time);
                        osc.stop(time + 0.4);
                    });
                }
            } catch (e) {
                console.warn('Audio playback suppressed', e);
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const btn = document.getElementById('sound-btn');
            const icon = document.getElementById('sound-icon');
            if (soundEnabled) {
                btn.classList.remove('bg-rose-900/40', 'text-rose-400');
                btn.classList.add('bg-slate-800', 'text-slate-200');
                icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>`;
            } else {
                btn.classList.remove('bg-slate-800', 'text-slate-200');
                btn.classList.add('bg-rose-900/40', 'text-rose-400');
                icon.innerHTML = `<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line>`;
            }
        }

                { en: 'Eagle', id: 'Elang' },
                { en: 'Dolphin', id: 'Lumba-lumba' },
                { en: 'Crocodile', id: 'Buaya' },
                { en: 'Butterfly', id: 'Kupu-kupu' },
                { en: 'Duck', id: 'Bebek' },
                { en: 'Horse', id: 'Kuda' }
            ],
            buah: [
                { en: 'Apple', id: 'Apel' },
                { en: 'Banana', id: 'Pisang' },
                { en: 'Orange', id: 'Jeruk' },
                { en: 'Mango', id: 'Mangga' },
                { en: 'Grape', id: 'Anggur' },
                { en: 'Carrot', id: 'Wortel' },
                { en: 'Tomato', id: 'Tomat' },
                { en: 'Potato', id: 'Kentang' },
                { en: 'Corn', id: 'Jagung' },
                { en: 'Watermelon', id: 'Semangka' },
                { en: 'Avocado', id: 'Alpukat' },
                { en: 'Strawberry', id: 'Stroberi' },
                { en: 'Pineapple', id: 'Nanas' },
                { en: 'Papaya', id: 'Pepaya' },
                { en: 'Melon', id: 'Melon' }
            ],
            transportasi: [
                { en: 'Car', id: 'Mobil' },
                { en: 'Motorcycle', id: 'Motor' },
                { en: 'Bicycle', id: 'Sepeda' },
                { en: 'Train', id: 'Kereta' },
                { en: 'Plane', id: 'Pesawat' },
                { en: 'Ship', id: 'Kapal' },
                { en: 'Bus', id: 'Bus' },
                { en: 'Helicopter', id: 'Helikopter' },
                { en: 'Truck', id: 'Truk' },
                { en: 'Submarine', id: 'Kapal Selam' },
                { en: 'Pedicab', id: 'Becak' },
                { en: 'Taxi', id: 'Taksi' },
                { en: 'Ambulance', id: 'Ambulans' },
                { en: 'Canoe', id: 'Sampan' },
                { en: 'Rikshaw', id: 'Bajaj' }
            ]
        };

        const gameGrid = document.getElementById('game-grid');
        const modeSelect = document.getElementById('mode-select');
        const board1p = document.getElementById('board-1p');
        const board2p = document.getElementById('board-2p');
        const moves1pDisplay = document.getElementById('moves-1p');
        const timer1pDisplay = document.getElementById('timer-1p');
        const matchesLeft1pDisplay = document.getElementById('matches-left-1p');
        const matchesLeft2pDisplay = document.getElementById('matches-left-2p');
        const victoryModal = document.getElementById('victory-modal');

        const p1Card = document.getElementById('p1-card');
        const p2Card = document.getElementById('p2-card');
        const p1ScoreDisplay = document.getElementById('p1-score');
        const p2ScoreDisplay = document.getElementById('p2-score');
        const p1Badge = document.getElementById('p1-turn-badge');
        const p2Badge = document.getElementById('p2-turn-badge');

        const turnOverlay = document.getElementById('turn-overlay');
        const turnModalBox = document.getElementById('turn-modal-box');
        const turnAvatar = document.getElementById('turn-avatar');
        const turnPlayerName = document.getElementById('turn-player-name');

        let gameMode = '2p'; // '1p' or '2p'
        let flippedCards = [];
        let currentPlayer = 1; // 1 or 2
        let playerScores = { 1: 0, 2: 0 };
        let totalPairs = 10;
        let matchesLeft = 10;
        let movesCount = 0;
        let timer = 0;
        let timerInterval = null;
        let isLockBoard = false;

        function initGame() {
            gameMode = modeSelect.value;
            const catKey = document.getElementById('category-select').value;
            totalPairs = parseInt(document.getElementById('difficulty-select').value) || 10;
            matchesLeft = totalPairs;
            movesCount = 0;

            // Toggle active scoreboard visual
            if (gameMode === '1p') {
                board1p.classList.remove('hidden');
                board2p.classList.add('hidden');
                moves1pDisplay.innerText = '0';
                matchesLeft1pDisplay.innerText = totalPairs;
            } else {
                board1p.classList.add('hidden');
                board2p.classList.remove('hidden');
                matchesLeft2pDisplay.innerText = totalPairs;
            }

            const selectedList = vocabularyCategories[catKey] || vocabularyCategories.dapur;
            const shuffledVocab = [...selectedList].sort(() => Math.random() - 0.5).slice(0, totalPairs);

            let deck = [];
            shuffledVocab.forEach((item, index) => {
                deck.push({ text: item.en, lang: 'EN', pairId: index });
                deck.push({ text: item.id, lang: 'ID', pairId: index });
            });

            deck.sort(() => Math.random() - 0.5);

            gameGrid.innerHTML = '';
            
            deck.forEach((cardData) => {
                const card = document.createElement('div');
                card.classList.add('perspective', 'h-24', 'sm:h-28', 'w-full');
                card.innerHTML = `
                    <div class="card-inner w-full h-full" data-pair-id="${cardData.pairId}">
                        <div class="card-back"></div>
                        <div class="card-front">
                            <span class="card-lang-tag ${cardData.lang.toLowerCase()}">${cardData.lang}</span>
                            <span>${cardData.text}</span>
                        </div>
                    </div>
                `;
                card.addEventListener('click', flipCard);
                gameGrid.appendChild(card);
            });

            resetStats();
            if (gameMode === '2p') {
                updatePlayerUI();
            } else {
                startTimer();
            }
        }

        function flipCard() {
            if (isLockBoard) return;
            getAudioContext();
            
            const inner = this.querySelector('.card-inner');
            if (inner.classList.contains('is-flipped') || inner.classList.contains('matched')) return;

            playSound('flip');
            inner.classList.add('is-flipped');
            flippedCards.push(inner);

            if (flippedCards.length === 2) {
                checkMatch();
            }
        }

        function checkMatch() {
            isLockBoard = true;
            movesCount++;
            if (gameMode === '1p') {
                moves1pDisplay.innerText = movesCount;
            }

            const [card1, card2] = flippedCards;
            const isMatch = card1.dataset.pairId === card2.dataset.pairId;

            if (isMatch) {
                playSound('match');
                card1.classList.add('matched');
                card2.classList.add('matched');

                matchesLeft--;
                if (gameMode === '1p') {
                    matchesLeft1pDisplay.innerText = matchesLeft;
                } else {
                    playerScores[currentPlayer]++;
                    p1ScoreDisplay.innerText = playerScores[1];
                    p2ScoreDisplay.innerText = playerScores[2];
                    matchesLeft2pDisplay.innerText = matchesLeft;
                }

                resetBoard();

                if (matchesLeft === 0) {
                    setTimeout(endGame, 600);
                }
            } else {
                playSound('mismatch');
                card1.classList.add('shake');
                card2.classList.add('shake');

                setTimeout(() => {
                    card1.classList.remove('is-flipped', 'shake');
                    card2.classList.remove('is-flipped', 'shake');
                    
                    if (gameMode === '2p') {
                        // Switch player turn on incorrect answer in 2P mode
                        switchTurn();
                    } else {
                        resetBoard();
                    }
                }, 900);
            }
        }

        function switchTurn() {
            currentPlayer = currentPlayer === 1 ? 2 : 1;
            updatePlayerUI();
            showTurnAnimation();
        }

        function updatePlayerUI() {
            if (currentPlayer === 1) {
                p1Card.classList.add('player-active-p1');
                p1Card.classList.remove('border-transparent', 'border-slate-700/50');
                p2Card.classList.remove('player-active-p2');
                p2Card.classList.add('border-slate-700/50');

                p1Badge.classList.remove('hidden');
                p2Badge.classList.add('hidden');
            } else {
                p2Card.classList.add('player-active-p2');
                p2Card.classList.remove('border-transparent', 'border-slate-700/50');
                p1Card.classList.remove('player-active-p1');
                p1Card.classList.add('border-slate-700/50');

                p2Badge.classList.remove('hidden');
                p1Badge.classList.add('hidden');
            }
        }

        function showTurnAnimation() {
            playSound('switch');

            if (currentPlayer === 1) {
                turnModalBox.style.borderColor = '#38bdf8';
                turnAvatar.style.backgroundColor = 'rgba(56, 189, 248, 0.2)';
                turnAvatar.style.borderColor = '#38bdf8';
                turnAvatar.innerHTML = '👤';
                turnPlayerName.innerText = 'GILIRAN PEMAIN 1';
                turnPlayerName.className = 'text-2xl sm:text-3xl font-black uppercase tracking-wide text-sky-400';
            } else {
                turnModalBox.style.borderColor = '#f43f5e';
                turnAvatar.style.backgroundColor = 'rgba(244, 63, 94, 0.2)';
                turnAvatar.style.borderColor = '#f43f5e';
                turnAvatar.innerHTML = '👤';
                turnPlayerName.innerText = 'GILIRAN PEMAIN 2';
                turnPlayerName.className = 'text-2xl sm:text-3xl font-black uppercase tracking-wide text-rose-400';
            }

            turnOverlay.classList.remove('hidden');
            turnModalBox.classList.add('turn-bounce-in');

            setTimeout(() => {
                turnOverlay.classList.add('hidden');
                turnModalBox.classList.remove('turn-bounce-in');
                resetBoard();
            }, 1200);
        }

        function resetBoard() {
            flippedCards = [];
            isLockBoard = false;
        }

        function startTimer() {
            clearInterval(timerInterval);
            timer = 0;
            timerInterval = setInterval(() => {
                timer++;
                const minutes = Math.floor(timer / 60).toString().padStart(2, '0');
                const seconds = (timer % 60).toString().padStart(2, '0');
                if (timer1pDisplay) timer1pDisplay.innerText = `${minutes}:${seconds}`;
            }, 1000);
        }

        function resetStats() {
            clearInterval(timerInterval);
            currentPlayer = 1;
            playerScores = { 1: 0, 2: 0 };
            p1ScoreDisplay.innerText = '0';
            p2ScoreDisplay.innerText = '0';
            timer1pDisplay.innerText = '00:00';
            victoryModal.classList.add('hidden');
            turnOverlay.classList.add('hidden');
        }

        function resetGame() {
            initGame();
        }

        function endGame() {
            clearInterval(timerInterval);
            playSound('win');
            startConfetti();

            const titleEl = document.getElementById('winner-title');
            const subtextEl = document.getElementById('winner-subtext');
            const statsBox = document.getElementById('victory-stats-box');

            if (gameMode === '1p') {
                const timeStr = timer1pDisplay.innerText;
                const accuracy = Math.round((totalPairs / movesCount) * 100) || 100;
                
                titleEl.innerText = '⚡ SELESAI DENGAN CEPAT!';
                titleEl.className = 'text-2xl sm:text-3xl font-black text-amber-400 mb-1';
                subtextEl.innerText = 'Kamu berhasil memadankan seluruh kartu!';

                statsBox.innerHTML = `
                    <div class="flex justify-between items-center text-slate-300 border-b border-slate-700/60 pb-2">
                        <span>Total Langkah:</span>
                        <strong class="text-sky-400 text-base font-black">${movesCount} kali</strong>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 border-b border-slate-700/60 pb-2">
                        <span>Waktu Tempuh:</span>
                        <strong class="text-amber-400 font-mono text-base font-black">${timeStr}</strong>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 pt-1">
                        <span>Akurasi Daya Ingat:</span>
                        <strong class="text-emerald-400 text-base font-black">${accuracy}%</strong>
                    </div>
                `;
            } else {
                document.getElementById('final-p1-score').innerText = `${playerScores[1]} Pasang`;
                document.getElementById('final-p2-score').innerText = `${playerScores[2]} Pasang`;

                if (playerScores[1] > playerScores[2]) {
                    titleEl.innerText = '🥇 PEMAIN 1 MENANG!';
                    titleEl.className = 'text-2xl sm:text-3xl font-black text-sky-400 mb-1';
                    subtextEl.innerText = 'Selamat! Pemain 1 mengumpulkan pasangan terbanyak!';
                } else if (playerScores[2] > playerScores[1]) {
                    titleEl.innerText = '🥇 PEMAIN 2 MENANG!';
                    titleEl.className = 'text-2xl sm:text-3xl font-black text-rose-400 mb-1';
                    subtextEl.innerText = 'Selamat! Pemain 2 mengumpulkan pasangan terbanyak!';
                } else {
                    titleEl.innerText = '🤝 PERMAINAN SERI!';
                    titleEl.className = 'text-2xl sm:text-3xl font-black text-amber-400 mb-1';
                    subtextEl.innerText = 'Hebat! Kedua pemain memiliki skor yang seimbang!';
                }

                statsBox.innerHTML = `
                    <div class="flex justify-between items-center text-slate-300 border-b border-slate-700/60 pb-2">
                        <span class="font-bold flex items-center gap-1.5 text-sky-400"><span>👤</span> Pemain 1:</span>
                        <strong class="text-sky-400 text-base font-black">${playerScores[1]} Pasang</strong>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 border-b border-slate-700/60 pb-2">
                        <span class="font-bold flex items-center gap-1.5 text-rose-400"><span>👤</span> Pemain 2:</span>
                        <strong class="text-rose-400 text-base font-black">${playerScores[2]} Pasang</strong>
                    </div>
                    <div class="flex justify-between items-center text-slate-300 pt-1">
                        <span>Mode Permainan:</span>
                        <strong class="text-amber-400 text-base font-black">1vs1 Tanpa Timer</strong>
                    </div>
                `;
            }

            victoryModal.classList.remove('hidden');
        }

        function startConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const colors = ['#38bdf8', '#fb7185', '#34d399', '#fbbf24', '#a78bfa'];

            for (let i = 0; i < 120; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    vy: Math.random() * 3 + 2,
                    vx: Math.random() * 2 - 1,
                    rot: Math.random() * 360
                });
            }

            function render() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                particles.forEach(p => {
                    p.y += p.vy;
                    p.x += p.vx;
                    ctx.save();
                    ctx.translate(p.x, p.y);
                    ctx.rotate((p.rot * Math.PI) / 180);
                    ctx.fillStyle = p.color;
                    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                    ctx.restore();
                });

                if (particles.some(p => p.y < canvas.height)) {
                    requestAnimationFrame(render);
                } else {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
            }
            render();
        }

        function toggleFullscreen() {
            const elem = document.documentElement;
            if (!document.fullscreenElement) {
                if (elem.requestFullscreen) elem.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        }

        window.onload = initGame;
    </script>
